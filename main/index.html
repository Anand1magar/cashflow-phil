<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHILRx — main flow</title>
<link rel="stylesheet" href="main.css">

<!-- No bundler in this project, so bare specifiers are resolved by an import map.
     agentation/dist/index.mjs imports "react", "react-dom" and "react/jsx-runtime".
     ?external=react keeps react-dom on the same React module instance. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "agentation": "../node_modules/agentation/dist/index.mjs"
  }
}
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0;padding:0;background:var(--color-surface-sunken)}</style>
</head><body>
<div id="root"></div>

<!-- ADD A PAGE, STEP 1 of 2: load its file here -->
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Page1.jsx"></script>
<script type="text/babel" src="Page2.jsx"></script>
<script type="text/babel" src="Page3.jsx"></script>
<script type="text/babel" src="Page4.jsx"></script>
<script type="text/babel" src="Page5.jsx"></script>
<script type="text/babel" src="Page6.jsx"></script>
<script type="text/babel" src="Page7.jsx"></script>
<script type="text/babel" src="Page8.jsx"></script>

<script type="text/babel">
  // ADD A PAGE, STEP 2 of 2: append its component name here, in flow order.
  const PAGE_ORDER = ['Page1', 'Page2', 'Page3', 'Page4', 'Page5', 'Page6', 'Page7', 'Page8'];

  function App() {
    const read = () => {
      const n = parseInt((window.location.hash.match(/^#\/(\d+)$/) || [])[1], 10);
      return Number.isInteger(n) && n >= 1 && n <= PAGE_ORDER.length ? n - 1 : 0;
    };
    const [i, setI] = React.useState(read);

    React.useEffect(() => {
      const onHash = () => setI(read());
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    const go = (next) => {
      if (next < 0 || next >= PAGE_ORDER.length) return;
      window.location.hash = '#/' + (next + 1);   // hashchange drives setI
    };

    const Page = window.MainFlow[PAGE_ORDER[i]];
    if (!Page) return <p style={{ padding: 24 }}>Missing component: {PAGE_ORDER[i]}</p>;
    return <Page onNext={() => go(i + 1)} onBack={() => go(i - 1)} />;
  }

  function boot() {
    const ready = window.MainFlow && PAGE_ORDER.every((n) => window.MainFlow[n]);
    if (ready) ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    else setTimeout(boot, 30);
  }
  boot();
</script>

<!-- Agentation (dev-only annotation overlay).
     There is no build step here, so process.env.NODE_ENV does not exist in the
     browser — gate on the host instead, which is the equivalent check. -->
<script type="module">
  const isDev = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if (isDev) {
    try {
      // agentation's bundle reads process.env.NODE_ENV once, expecting a bundler
      // to have replaced it. Nothing defines `process` in a plain browser, so shim it.
      window.process = window.process || { env: { NODE_ENV: 'development' } };
      const [{ default: React }, { createRoot }, { Agentation }] = await Promise.all([
        import('react'),
        import('react-dom/client'),
        import('agentation'),
      ]);
      const host = document.createElement('div');
      host.id = 'agentation-root';
      document.body.appendChild(host);
      createRoot(host).render(
        React.createElement(Agentation, {
          endpoint: 'http://localhost:4747',
          onSessionCreated: (sessionId) => console.log('Agentation session:', sessionId),
        })
      );
    } catch (err) {
      console.warn('Agentation failed to load:', err);
    }
  }
</script>
</body></html>
